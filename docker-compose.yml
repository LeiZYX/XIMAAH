services:
  mysql:
    image: mysql:8.0
    container_name: xima-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xima_assessment_hub}
      MYSQL_USER: ${MYSQL_USER:-xima}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - xima_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  data-processor:
    build:
      context: ./services/data-processor
    container_name: xima-data-processor
    restart: unless-stopped
    networks:
      - xima_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8001/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: xima-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      data-processor:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_PROCESSOR_URL: http://data-processor:8001
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xima_assessment_hub}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/var/backups/xima-assessment-hub}
      BACKUP_SCHEDULE_TIMEZONE: ${BACKUP_SCHEDULE_TIMEZONE:-Asia/Shanghai}
    volumes:
      - backup_data:/var/backups/xima-assessment-hub
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - xima_internal

  # Polls the app every 15 minutes; the API decides whether a backup is due
  # based on Backup Settings (enabled / frequency / time).
  backup-cron:
    image: curlimages/curl:8.12.1
    container_name: xima-backup-cron
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    environment:
      BACKUP_CRON_SECRET: ${BACKUP_CRON_SECRET:-}
      BACKUP_CRON_INTERVAL_SECONDS: ${BACKUP_CRON_INTERVAL_SECONDS:-900}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${BACKUP_CRON_SECRET}" ]; then
          echo "backup-cron: BACKUP_CRON_SECRET is empty; sleeping without calling the API."
          while true; do sleep 3600; done
        fi
        echo "backup-cron: polling every $${BACKUP_CRON_INTERVAL_SECONDS}s"
        while true; do
          code=0
          body="$$(curl -sS -w '\n%{http_code}' -X POST \
            -H "x-backup-cron-secret: $${BACKUP_CRON_SECRET}" \
            "http://app:3000/api/admin/settings/backup/run-scheduled")" || code=$$?
          if [ "$$code" -ne 0 ]; then
            echo "backup-cron: request failed (curl exit $$code)"
          else
            echo "backup-cron: $$body"
          fi
          sleep "$${BACKUP_CRON_INTERVAL_SECONDS}"
        done
    networks:
      - xima_internal

networks:
  xima_internal:
    driver: bridge

volumes:
  mysql_data:
  backup_data:
